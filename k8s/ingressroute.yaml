---
# Exposes rapid-cdl-admin on its OWN hostname (the shared rcdl host already
# belongs to oni-ui + the API).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rapid-cdl-admin
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`admin.rapid-cdl.edu.au`) && PathPrefix(`/admin-api`)
      kind: Rule
      priority: 30
      middlewares:
        - strip-admin-api
      services:
        - name: rapid-cdl-admin-api
          port: 8083
    - match: Host(`admin.rapid-cdl.edu.au`) && PathPrefix(`/api`)
      kind: Rule
      middlewares:
        - name: rapid-cdl-admin-strip-api
      services:
        - name: rapid-community-data-lab-api
          port: 8080
    - match: Host(`admin.rapid-cdl.edu.au`)
      kind: Rule
      services:
        - name: rapid-cdl-admin
          port: 80
---
# Strips /api so the backend sees /admin/repository, /version, etc.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rapid-cdl-admin-strip-api
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-admin-api
spec:
  stripPrefix:
    prefixes:
      - /admin-api
