# rapid-cdl-admin frontend stack — mirrors the K3s architecture locally:
# a Traefik edge routes /api → backend and everything else → the Caddy static
# admin. The admin container no longer proxies /api (Traefik does), matching the
# cluster exactly.
#
# First-time setup (run once on the host):
#   docker network create rapid-community-data-lab
# Bring up the backend first (postgres + opensearch + api), then run from the
# repository root: docker compose --env-file .env -f docker/docker-compose.yml up -d --build
# If running from this directory instead, use: docker compose --env-file ../.env up -d --build
# Mac: Open http://localhost:8082 
# WSL2: explorer.exe http://localhost:8082

networks:
  rapid-community-data-lab:
    external: true
    name: rapid-community-data-lab

services:
  traefik:
    image: traefik:v3.3
    container_name: rapid-cdl-traefik
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
    ports:
      # Same host port the old nginx admin used, so existing links keep working.
      - "8082:80"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - rapid-community-data-lab
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: "/api"
        VITE_ADMIN_API_BASE_URL: "/admin-api"
        VITE_INGEST_API_BASE_URL: "/ingest-api"
    image: rapid-cdl-admin:local
    container_name: admin
    networks:
      - rapid-community-data-lab
    restart: unless-stopped
