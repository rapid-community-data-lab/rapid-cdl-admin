---
# Local-only Traefik dynamic config (file provider).
http:
  routers:
    admin-api:
      rule: "PathPrefix(`/admin-api`)"
      entryPoints: ["web"]
      service: admin-api
      middlewares: ["strip-admin-api"]
      priority: 110
    ingest-api:
      rule: "PathPrefix(`/ingest-api`)"
      entryPoints: ["web"]
      service: ingest-api
      middlewares: ["strip-ingest-api"]
      priority: 120
    admin:
      rule: "PathPrefix(`/`)"
      entryPoints: ["web"]
      service: admin
      priority: 1
    api:
      rule: "PathPrefix(`/api`)"
      entryPoints: ["web"]
      service: api
      middlewares: ["strip-api"]
      priority: 100          # beats the admin catch-all (priority 1)
  middlewares:
    strip-admin-api:
      stripPrefix:
        prefixes: ["/admin-api"]
    strip-ingest-api:
      stripPrefix:
        prefixes: ["/ingest-api"]
    strip-api:
      stripPrefix:
        prefixes: ["/api"]
  services:
    admin-api:
      loadBalancer:
        servers:
          - url: "http://admin-api:8083"
    ingest-api:
      loadBalancer:
        servers:
          - url: "http://data-ingester:8084"
    admin:
      loadBalancer:
        servers:
          - url: "http://admin:80"
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"
